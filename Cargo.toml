[package]
name = "whatsapp"
version = "0.6.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "WhatsApp Business Cloud API client"
homepage = "https://github.com/sajuthankappan/whatsapp-cloud-api-rs"
repository = "https://github.com/sajuthankappan/whatsapp-cloud-api-rs"
readme = "README.md"
keywords = ["whatsapp", "cloud-api", "business"]
categories = ["api-bindings"]

[dependencies]
log = "0.4.20"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"

[features]
default = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dev-dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.11"
tokio = { version = "1.34.0", features = ["full"] }
